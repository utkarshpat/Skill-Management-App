parameters:
  - name: appServiceConnection
    displayName: Azure Resource Manager service connection
    type: string
    default: disabled

trigger:
  batch: true
  branches:
    include:
      - main
      - production

pool:
  vmImage: ubuntu-latest

jobs:
  - job: Build
    displayName: Test and build Skill Genie
    steps:
      - checkout: self

      - task: UseNode@1
        displayName: Use Node.js 24
        inputs:
          version: '24.x'

      - script: npm ci
        displayName: Install locked dependencies

      - script: npm run docs:check
        displayName: Check generated handover and schema reference

      - script: npm run architecture:check
        displayName: Check repository architecture

      - script: npm run typecheck
        displayName: Typecheck workspaces

      - bash: |
          set -euo pipefail
          mkdir -p artifacts/test-results
          node --test --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=artifacts/test-results/architecture.xml \
            scripts/architecture.test.mjs scripts/package-appservice.test.mjs \
            scripts/coverage-source.test.mjs scripts/remap-v8-coverage.test.mjs
        displayName: Run architecture and packaging tests

      - script: node scripts/test-coverage.mjs
        displayName: Run API and web regression tests with coverage

      - script: npm run build
        displayName: Build the release

      - script: npx playwright install --with-deps chromium
        displayName: Install Chromium for browser tests

      - bash: |
          status=0
          npm run test:e2e || status=$?
          if [ -d artifacts/e2e ]; then
            echo '##vso[task.setvariable variable=browserReportsReady]true'
          fi
          exit "$status"
        displayName: Run desktop and mobile browser tests

      - script: npm run coverage:browser
        displayName: Merge browser and web regression coverage

      # The existing 90% target is reported separately from required checks.
      - script: npm run coverage:check -- --report-only
        displayName: Report coverage against the 90% target

      - script: >-
          python scripts/normalize-node-junit.py artifacts/test-results/architecture.xml
          artifacts/coverage/current/api/junit.xml artifacts/coverage/current/web/junit.xml
        displayName: Normalize Node JUnit reports for Azure DevOps
        condition: succeededOrFailed()

      - task: PublishTestResults@2
        displayName: Publish architecture, API, web and Playwright test results
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: |
            artifacts/test-results/architecture.xml
            artifacts/coverage/current/*/junit.xml
            artifacts/e2e/junit.xml
          mergeTestResults: true
          testRunTitle: Skill Genie regression tests
          failTaskOnFailedTests: true
          failTaskOnFailureToPublishResults: true
          failTaskOnMissingResultsFile: true

      - task: PublishCodeCoverageResults@2
        displayName: Publish API and combined web coverage
        inputs:
          summaryFileLocation: |
            $(System.DefaultWorkingDirectory)/artifacts/coverage/current/api/cobertura-coverage.xml
            $(System.DefaultWorkingDirectory)/artifacts/coverage/combined-web/cobertura-coverage.xml
          pathToSources: $(System.DefaultWorkingDirectory)
          failIfCoverageEmpty: true

      - task: PublishPipelineArtifact@1
        displayName: Publish browser reports and failure traces
        condition: and(succeededOrFailed(), eq(variables['browserReportsReady'], 'true'))
        inputs:
          targetPath: '$(System.DefaultWorkingDirectory)/artifacts/e2e'
          artifact: browser-test-reports

      - bash: |
          set -euo pipefail
          npm run package:azure
          node scripts/package-migrations.mjs
          cp artifacts/skills-appservice-*.zip artifacts/skills-migrations-*.zip "$BUILD_ARTIFACTSTAGINGDIRECTORY/"
        displayName: Package the app and ordered SQL migrations
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

      - task: PublishPipelineArtifact@1
        displayName: Publish deployment packages
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
        inputs:
          targetPath: '$(Build.ArtifactStagingDirectory)'
          artifact: skill-genie-release

      - ${{ if ne(parameters.appServiceConnection, 'disabled') }}:
          - bash: |
              set -euo pipefail
              runtime="$BUILD_ARTIFACTSTAGINGDIRECTORY/runtime"
              mkdir -p "$runtime/apps/api" "$runtime/apps/web"
              cp package.json package-lock.json "$runtime/"
              cp apps/api/package.json "$runtime/apps/api/"
              cp apps/web/package.json "$runtime/apps/web/"
              cp -R apps/api/dist "$runtime/apps/api/"
              cp -R apps/web/dist "$runtime/apps/web/"
              cp -R App_Data "$runtime/"
              cd "$runtime"
              npm ci --omit=dev
            displayName: Stage compiled app and locked production dependencies
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/production'))

          - task: ArchiveFiles@2
            displayName: Archive the tested runtime
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/production'))
            inputs:
              rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/runtime'
              includeRootFolder: false
              archiveType: zip
              archiveFile: '$(Build.ArtifactStagingDirectory)/skill-genie-runtime.zip'

          - task: PublishPipelineArtifact@1
            displayName: Publish the runtime for deployment
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/production'))
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/skill-genie-runtime.zip'
              artifact: skill-genie-runtime

  - ${{ if ne(parameters.appServiceConnection, 'disabled') }}:
      - job: Deploy
        displayName: Deploy the tested production build to Skill Genie Dev
        dependsOn: Build
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/production'), in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI', 'Manual'))
        steps:
          - checkout: none
          - download: current
            artifact: skill-genie-runtime

          - task: AzureCLI@2
            displayName: Verify the App Service deployment source and build settings
            inputs:
              azureSubscription: ${{ parameters.appServiceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                app=SSSkillmgmtAppWebAppDev
                group=SS_SkillMgmtApp_Dev
                source_repo=$(az webapp deployment source show --resource-group "$group" --name "$app" --query repoUrl -o tsv)
                if [[ -n "$source_repo" && "$source_repo" != None ]]; then
                  echo 'Disconnect the App Service Git deployment in Deployment Center before enabling pipeline deployment.' >&2
                  exit 1
                fi
                remote_build=$(az webapp config appsettings list --resource-group "$group" --name "$app" --query "[?name=='SCM_DO_BUILD_DURING_DEPLOYMENT' || name=='ENABLE_ORYX_BUILD'].value" -o tsv)
                if grep -Eiq '^(true|1)$' <<< "$remote_build"; then
                  echo 'Disable App Service remote build before deploying the compiled runtime.' >&2
                  exit 1
                fi

          - task: AzureWebApp@1
            displayName: ZIP deploy to Skill Genie Dev
            inputs:
              azureSubscription: ${{ parameters.appServiceConnection }}
              appType: webAppLinux
              appName: SSSkillmgmtAppWebAppDev
              package: '$(Pipeline.Workspace)/skill-genie-runtime/skill-genie-runtime.zip'

          - bash: |
              set -euo pipefail
              url=https://ssskillmgmtappwebappdev-dugxhfchcbhsc3gv.uksouth-01.azurewebsites.net
              archive="$(Pipeline.Workspace)/skill-genie-runtime/skill-genie-runtime.zip"
              expected=$(unzip -p "$archive" apps/web/dist/index.html | grep -oE '/assets/index-[^"[:space:]]+\.js')
              for attempt in {1..18}; do
                if landing=$(curl --fail --silent --show-error --max-time 10 "$url/?release=$BUILD_SOURCEVERSION") &&
                  [[ "$landing" == *"$expected"* ]] &&
                  health=$(curl --fail --silent --show-error --max-time 10 "$url/api/health") &&
                  grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' <<< "$health"; then
                  echo "Release $BUILD_SOURCEVERSION is serving its frontend and health endpoint."
                  exit 0
                fi
                sleep 10
              done
              echo "App Service did not serve the expected release frontend and health endpoint." >&2
              exit 1
            displayName: Verify the deployed frontend and API health
