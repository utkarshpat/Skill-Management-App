<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-1XU7a5H1feegcD5TK9uEYJgrdb0wUmqkbBfdFh9ylUY='; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'; frame-src 'none'">
<title>Announcement design</title><style>html,body{margin:0;padding:0;font-family:system-ui,sans-serif;overflow-x:hidden}*{box-sizing:border-box}#bridge-status{font:13px system-ui;margin:8px;color:inherit}button,input,select,textarea{font:inherit}output[data-identity]{display:block;overflow-wrap:anywhere}fieldset[data-radio] label{display:flex;align-items:center;gap:.6rem;min-height:44px}input:is([type=radio],[type=checkbox]){accent-color:#126b70}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}</style><style id="bridge-css"></style></head>
<body><div id="bridge-canvas"></div><p id="bridge-status" role="status"></p>
<script id="announcement-bridge">
(() => {
  'use strict';
  const host = window.parent, canvas = document.getElementById('bridge-canvas'), stylesheet = document.getElementById('bridge-css'), status = document.getElementById('bridge-status');
  const channel = location.hash.slice(1);
  if (!/^[0-9a-f-]{36}$/i.test(channel)) return;
  const bridge = new MessageChannel();
  let current, signature = '';
  const element = binding => document.getElementById(binding.elementId);
  const send = data => bridge.port1.postMessage({ ...data, channel });
  const resize = () => send({ type: 'announcement.height', height: Math.max(64, Math.min(1800, Math.ceil(canvas.scrollHeight + status.offsetHeight + 16))) });
  const locked = () => !current || current.busy || current.answered;
  function apply(value) {
    current = value;
    const next = JSON.stringify([value.html, value.css, value.bindings, value.definition.fields]);
    const fresh = signature !== next;
    if (fresh) { signature = next; stylesheet.textContent = value.css; canvas.innerHTML = value.html; }
    document.body.dataset.surface = value.surface;
    document.body.dataset.theme = value.theme;
    for (const binding of value.bindings) {
      const node = element(binding); if (!node) continue;
      if (binding.kind === 'content') node.textContent = value.definition[binding.key] || '';
      if (binding.kind === 'identity') {
        let output = node;
        if (node.tagName !== 'OUTPUT') {
          output = document.createElement('output');
          output.id = node.id;
          output.className = node.className;
          node.replaceWith(output);
        }
        output.dataset.identity = binding.key;
        output.value = value.person[binding.key] || 'Unavailable';
      }
      if (binding.kind === 'image') { if (/^data:image\/(png|jpeg|webp);base64,/.test(value.image || '')) node.src = value.image; else node.removeAttribute('src'); }
      if (binding.kind === 'field') {
        const field = value.definition.fields.find(f => f.id === binding.key); if (!field) { node.disabled = true; continue; }
        if (field.type === 'radio') {
          node.disabled = locked();
          if (fresh) {
            node.dataset.radio = '';
            const legend = document.createElement('legend');
            legend.textContent = field.label + (field.required ? ' *' : '');
            node.replaceChildren(legend, ...field.options.map(option => {
              const label = document.createElement('label'), radio = document.createElement('input');
              radio.type = 'radio'; radio.name = field.id; radio.value = option; radio.required = field.required;
              label.append(radio, document.createTextNode(option));
              return label;
            }));
          }
          continue;
        }
        node.name = field.id; node.required = field.required; node.disabled = locked(); node.readOnly = false;
        if (node.tagName === 'INPUT') node.type = ['checkbox', 'date'].includes(field.type) ? field.type : 'text';
        if (node.tagName === 'INPUT' || node.tagName === 'TEXTAREA') node.maxLength = field.type === 'longText' ? 2000 : 240;
        if (fresh && node.tagName === 'SELECT') {
          node.replaceChildren(new Option('Select an option', ''));
          for (const option of field.type === 'rating' ? ['1','2','3','4','5'] : field.options) node.add(new Option(option, option));
        }
      }
      if (binding.kind === 'action' || binding.kind === 'vote') {
        node.disabled = locked() || (binding.key === 'submit' && !value.person.email); node.type = 'button';
        if (binding.kind === 'vote') node.textContent = value.definition.options[Number(binding.key)] || '';
      }
      if (binding.kind === 'form') { if (value.surface === 'banner') node.style.setProperty('display', 'none', 'important'); else node.style.removeProperty('display'); }
      if (binding.kind === 'action' && binding.key === 'open-form') { if (value.surface !== 'banner') node.style.setProperty('display','none','important'); else node.style.removeProperty('display'); }
    }
    status.textContent = value.answered ? 'Response recorded.' : value.busy ? 'Submitting...' : value.definition.fields.length && !value.person.email ? 'Sign in again to confirm your work email.' : '';
    requestAnimationFrame(resize);
  }
  bridge.port1.onmessage = event => {
    if (event.data?.type !== 'announcement.render' || event.data.channel !== channel) return;
    apply(event.data);
  };
  document.addEventListener('click', event => {
    const button = event.target.closest?.('button'); if (!button || !current) return;
    const binding = current.bindings.find(b => b.elementId === button.id); if (!binding || locked()) { event.preventDefault(); return; }
    if (binding.kind === 'vote') { event.preventDefault(); send({ type: 'announcement.action', action: 'vote', index: Number(binding.key) }); }
    if (binding.kind === 'action' && binding.key === 'open-form') { event.preventDefault(); send({ type:'announcement.action', action:'open-form' }); }
    if (binding.kind === 'action' && binding.key === 'submit') { event.preventDefault(); submit(button.closest('form')); }
  }, true);
  function submit(form) {
    if (locked() || !current.person.email || form?.id !== 'ann-form' || !form.reportValidity()) return;
    const answers = Object.fromEntries(current.bindings.filter(b => b.kind === 'field').map(binding => {
      const node = element(binding), field = current.definition.fields.find(f => f.id === binding.key);
      const answer = field?.type === 'radio' ? (node.querySelector('input:checked')?.value ?? '')
        : field?.type === 'checkbox' ? node.checked : node.value;
      return [binding.key, answer];
    }));
    send({ type:'announcement.action', action:'submit', answers });
  }
  document.addEventListener('submit', event => {
    event.preventDefault(); event.stopPropagation(); submit(event.target);
  }, true);
  document.addEventListener('keydown', event => { if (event.key === 'Enter' && !event.isComposing && event.target.tagName === 'INPUT' && !['radio', 'checkbox'].includes(event.target.type)) { event.preventDefault(); submit(event.target.closest('form')); } }, true);
  new ResizeObserver(resize).observe(canvas);
  host.postMessage({ type:'announcement.ready', channel }, '*', [bridge.port2]);
})();
</script></body></html>
